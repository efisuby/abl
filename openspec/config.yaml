schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
context: |
  All OpenSpec artifacts (proposal, design, specs, tasks) are written in English,
  regardless of the product's UI language. The app itself ships with Russian and
  English localization.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  specs:
    - Write requirement names and scenarios in English even when they quote Russian UI strings.
    - Every requirement needs at least one scenario with concrete input and observable outcome.
  tasks:
    - Every task states how it is verified.
